name: Daily pull
on:
  schedule: [{ cron: '17 14 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run pull
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      - run: npm run build
      - run: |
          git config user.name "insights-bot"
          git config user.email "insights-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily numbers" && git push
      - uses: actions/upload-artifact@v4
        with: { name: insights-page, path: dist/index.html }
